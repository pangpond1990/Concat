[package]
name = "concat-browser"
version = "0.2.8"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
console_error_panic_hook = "0.1"
concat-core = { path = "../../src/crates/concat-core" }

[build-dependencies]
slint-build = "=1.18.0"

[profile.release]
opt-level = "s"
lto = "thin"
debug = 0
