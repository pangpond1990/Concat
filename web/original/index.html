<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concat — Original UI Web Port</title><link rel="stylesheet" href="shell.css"><script type="module" src="client.js"></script></head>
<body><canvas id="canvas" tabindex="0" aria-label="Concat video editor"></canvas><div id="status" role="status">Loading the original Concat interface…</div>
